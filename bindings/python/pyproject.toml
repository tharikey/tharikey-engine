[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "tharikey"
version = "0.1.0"
description = "ThariKey — a data-driven Thaana (Dhivehi) transliteration / keymap engine."
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.maturin]
module-name = "tharikey"
manifest-path = "Cargo.toml"
