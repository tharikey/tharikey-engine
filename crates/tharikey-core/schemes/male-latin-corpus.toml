# Malé Latin (corpus) — base male-latin + a data-mined, net-scored `[rewrites]` post-correction layer.
# GENERATED by the toolkit corpus-mining pipeline from politecat314 + alakxender clean-consensus pairs.
# Do not hand-edit; re-run the pipeline. Held-out validation: +4.14pts word-exact over baseline male-latin.

[meta]
id = "male-latin-corpus"
name = "Malé Latin+"
description = "Malé Latin, corpus-tuned for higher accuracy."
about = "Malé Latin plus a data-mined, net-scored post-correction layer (measured on a 290k-pair human corpus), trading a little debuggability for higher word-level accuracy (+4.14pts word-exact on a held-out split). Still lexicon-free."
base = "male-latin"
input = "text"
output = "thaana"
reversible = false  # the rewrite corrections are not cleanly invertible
lossy = true
version = "1.0"

# 99 net-positive rules as [pre, match, post, out], ordered by net effect (fixes - breaks) on
# the training split. Each field is separately quoted (keeps editor bidi local).
