# Dhivehi Phonetic keyboard layout.
# Base + shift follow SIL Global's "Divehi Phonetic Basic" (Keyman basic_kbddiv1, MIT). Two deliberate
# departures: ޱ NAA on `x` (the one Thaana letter SIL omits — Apple's Dhivehi-QWERTY puts it here too;
# x's old × was legacy cruft, dropped), and ﷲ ALLAH ligature on Shift+F (SIL placement; common muscle
# memory). ThariKey also adds: optional long-vowel double-tap, the rufiyaa sign, RTL bracket-flip, and a
# full Arabic layer on ⌥ / ⇧⌥ (borrowed from Apple's Dhivehi-QWERTY). The ﷽ BISMILLAH lives on that layer
# now (⇧⌥+p) — it used to sit on the backtick, which is now a plain `.
# Keys are labelled by US-QWERTY physical position. Modifiers are layers, not strings.

[meta]
id = "phonetic"
name = "Thaana Phonetic"
description = "Latin keys map to the Thaana letters they sound like."
about = "Base and shift layers follow SIL Global's “Divehi Phonetic Basic” (Keyman basic_kbddiv1, MIT). ThariKey places ޱ NAA on x (the one letter SIL omits) and ﷲ on ⇧F, adds an optional long-vowel double-tap, the rufiyaa sign, RTL bracket-flip, and a full Arabic layer on ⌥/⇧⌥ (borrowed from Apple's Dhivehi-QWERTY; ﷽ sits on ⇧⌥+p)."
base = "thaana-common"   # inherits shared smart-quote + punctuation defaults
input = "keys"
output = "thaana"
reversible = false
version = "1.0"

[layers.base]
a = "ަ"   # ABAFILI
s = "ސ"   # SEENU
d = "ދ"   # DHAALU
f = "ފ"   # FAAFU
h = "ހ"   # HAA
g = "ގ"   # GAAFU
z = "ޒ"   # ZAVIYANI
c = "ޗ"   # CHAVIYANI
v = "ވ"   # VAAVU
b = "ބ"   # BAA
q = "ް"   # SUKUN
w = "އ"   # ALIFU
e = "ެ"   # EBEFILI
r = "ރ"   # RAA
y = "ޔ"   # YAA
t = "ތ"   # THAA
o = "ޮ"   # OBOFILI
u = "ު"   # UBUFILI
i = "ި"   # IBIFILI
p = "ޕ"   # PAVIYANI
l = "ލ"   # LAAMU
j = "ޖ"   # JAVIYANI
k = "ކ"   # KAAFU
n = "ނ"   # NOONU
m = "މ"   # MEEMU
x = "ޱ"   # NAA (U+07B1) — the one letter SIL leaves unmapped; placed on x like Apple (x's old × was cruft)
";" = "؛"   # U+061B Arabic semicolon (RTL-correct)
"," = "،"   # U+060C Arabic comma (RTL-correct)
"'" = "'"   # straight apostrophe (smart-quotes may replace it)
# (backtick is left unmapped → literal `; ﷽ BISMILLAH now lives on the Arabic layer at ⇧⌥+p)
"[" = "["   # bracket keys mapped in US positions; the bracket_flip transform mirror-swaps the OUTPUT
"]" = "]"

[layers.shift]
a = "ާ"   # AABAAFILI
s = "ށ"   # SHAVIYANI
d = "ޑ"   # DAVIYANI
f = "ﷲ"   # U+FDF2 ARABIC LIGATURE ALLAH — SIL placement (Shift+F); common muscle memory
h = "ޙ"   # HHAA
g = "ޣ"   # GHAINU
z = "ޡ"   # ZO
x = "ޘ"   # TTAA
c = "ޝ"   # SHEENU
v = "ޥ"   # WAAVU (loan)
b = "ޞ"   # SAADHU
q = "ޤ"   # QAAFU
w = "ޢ"   # AINU
e = "ޭ"   # EYBEYFILI
r = "ޜ"   # ZAA
y = "ޠ"   # TO
t = "ޓ"   # TAVIYANI
o = "ޯ"   # OABOAFILI
u = "ޫ"   # OOBOOFILI
i = "ީ"   # EEBEEFILI
l = "ޅ"   # LHAVIYANI
j = "ޛ"   # THAALU
k = "ޚ"   # KHAA
n = "ޏ"   # GNAVIYANI
m = "ޟ"   # DAADHU
"/" = "؟"   # U+061F Arabic question mark
"'" = "\""  # straight double quote (smart-quotes may replace it)
"[" = "{"   # brace keys (US positions); flip mirror-swaps the output
"]" = "}"
"9" = "("   # paren keys (US: Shift+9 / Shift+0); flip mirror-swaps the output
"0" = ")"
"4" = "$"   # Shift+4 — the rufiyaa transform substitutes "$" → ⃂ (toggleable); long-press → $ / €

# Arabic layer (⌥ and ⇧⌥) — re-encoded from Apple's "Dhivehi-QWERTY" Option layer (codepoint facts, not
# their file). The IME already routes the Option modifier to these layers (see InputController). Arabic
# letters sit phono-positionally; the harakat (vowel marks) land on the Thaana fili keys (a/u/i/q/p) so
# Thaana muscle memory carries over. ⇧⌥ adds shifted letters, tanween, hamza forms, and the religious
# ligatures (﷽ on p, ﷺ on -, ﷻ on =). Letters that have no ⇧⌥ form in Apple's layout are simply omitted.
[layers.opt]
q = "ْ"   # U+0652 ARABIC SUKUN (harakat — Thaana SUKUN key)
w = "ا"   # U+0627 ALEF
e = "ء"   # U+0621 HAMZA
r = "ر"   # U+0631 REH
t = "ت"   # U+062A TEH
y = "ي"   # U+064A YEH
u = "ُ"   # U+064F DAMMA (harakat — UBUFILI key)
i = "ِ"   # U+0650 KASRA (harakat — IBIFILI key)
o = "أ"   # U+0623 ALEF WITH HAMZA ABOVE
p = "ّ"   # U+0651 SHADDA (harakat)
a = "َ"   # U+064E FATHA (harakat — ABAFILI key)
s = "س"   # U+0633 SEEN
d = "د"   # U+062F DAL
f = "ف"   # U+0641 FEH
g = "غ"   # U+063A GHAIN
h = "ه"   # U+0647 HEH
j = "ج"   # U+062C JEEM
k = "ك"   # U+0643 KAF
l = "ل"   # U+0644 LAM
z = "ظ"   # U+0638 ZAH
x = "ط"   # U+0637 TAH
c = "ث"   # U+062B THEH
v = "و"   # U+0648 WAW
b = "ب"   # U+0628 BEH
n = "ن"   # U+0646 NOON
m = "م"   # U+0645 MEEM

[layers.shift_opt]
q = "ق"   # U+0642 QAF
w = "ع"   # U+0639 AIN
e = "ئ"   # U+0626 YEH WITH HAMZA ABOVE
r = "ز"   # U+0632 ZAIN
t = "ة"   # U+0629 TEH MARBUTA
y = "ى"   # U+0649 ALEF MAKSURA
u = "ٌ"   # U+064C DAMMATAN
i = "ٍ"   # U+064D KASRATAN
o = "آ"   # U+0622 ALEF WITH MADDA ABOVE
p = "﷽"   # U+FDFD BISMILLAH
a = "ً"   # U+064B FATHATAN
s = "ش"   # U+0634 SHEEN
f = "ذ"   # U+0630 THAL
h = "ح"   # U+062D HAH
j = "ض"   # U+0636 DAD
k = "خ"   # U+062E KHAH
v = "ؤ"   # U+0624 WAW WITH HAMZA ABOVE
b = "ش"   # U+0634 SHEEN — Apple maps b here same as s (a quirk in their layout; kept for fidelity)
n = "ص"   # U+0635 SAD
"-" = "ﷺ"   # U+FDFA SALLALLAAHU ALAYHI WA SALLAM
"=" = "ﷻ"   # U+FDFB JALLA JALAALUHU

# Long-press variants: rare letters / alternates reachable by holding a key (IME surfaces a variant
# panel; rendering deferred to the IMK layer). Variants are explicit inserts — they bypass transforms.
[variants]
"4" = ["$", "€"]     # hold Shift+4 -> literal currency signs (bypass the rufiyaa substitution)

# Bracket-key flip is inherited from thaana-common (shared default). Bracket KEYS are mapped above
# (US positions); the engine swaps the output for RTL ergonomics.

# Smart-quote defaults are inherited from thaana-common (shared, aligned across schemes).

# Option layer still reserved for directional marks (RLM/LRM/ZWNJ), ﷲ, etc. — TODO.

# Toggleable nicety: tap a short-vowel key twice to get its long counterpart (the Shift form),
# instead of reaching for Shift. All five share one rule name so the IME exposes a single on/off
# setting. Off by default. SUKUN (q) has no long variant, so there is no rule for it.
[[sequence]]
name = "long-vowel-double-tap"
desc = "a a -> AABAAFILI"
label = "Long-vowel double-tap"
description = "Tap a short-vowel key twice to type its long form (e.g. a a → ާ), instead of reaching for Shift."
match = "a a"
emit = "ާ"
optional = true
default = false

[[sequence]]
name = "long-vowel-double-tap"
desc = "i i -> EEBEEFILI"
match = "i i"
emit = "ީ"
optional = true
default = false

[[sequence]]
name = "long-vowel-double-tap"
desc = "u u -> OOBOOFILI"
match = "u u"
emit = "ޫ"
optional = true
default = false

[[sequence]]
name = "long-vowel-double-tap"
desc = "e e -> EYBEYFILI"
match = "e e"
emit = "ޭ"
optional = true
default = false

[[sequence]]
name = "long-vowel-double-tap"
desc = "o o -> OABOAFILI"
match = "o o"
emit = "ޯ"
optional = true
default = false
